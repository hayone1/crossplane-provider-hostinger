name: End to End (mock API)

# Drives every managed resource, in both API variants, through create,
# references, update and delete against test/mockapi. Unlike uptest
# (/test-examples), it needs no Hostinger account and buys nothing.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Run
        run: ./test/e2e/run.sh
