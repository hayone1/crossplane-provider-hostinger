name: Release

# Publishes the provider package once CI passed on main. The version comes
# from the commits since the last tag (hack/next-version.sh). The image is
# scanned before anything is pushed; the package is then signed (keyless
# cosign), gets SLSA build provenance and an SBOM, and the GitHub release
# (which creates the tag) comes last, so a failed run can simply be re-run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v0.2.0); computed from the commits if empty"
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'
  CRANE_VERSION: 'v0.20.2'
  UP_VERSION: 'v0.55.0'
  UP_SHA256: '92faee16e91d39204ec7e45d2b1f63c2d741045ffb8cf9cfbac8ba2972ac69e6'
  GHCR_ORG: ghcr.io/hayone1
  UPBOUND_ORG: xpkg.upbound.io/codejourney
  PACKAGE: provider-hostinger

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: write     # GitHub release and tag
      packages: write     # GHCR
      id-token: write     # keyless signing and attestations
      attestations: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$INPUT_VERSION
          [[ -n $version ]] || version=$(hack/next-version.sh "$SHA")
          if [[ -n $version && ! $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version $version"
            exit 1
          fi
          if [[ -n $version ]] && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::tag $version exists already"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: ${version:-nothing to release}"

      - name: Setup QEMU
        if: steps.version.outputs.version != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Setup Go
        if: steps.version.outputs.version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup cosign
        if: steps.version.outputs.version != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Setup crane
        if: steps.version.outputs.version != ''
        run: go install github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION

      - name: Vendor Dependencies
        if: steps.version.outputs.version != ''
        run: make vendor vendor.check

      - name: Build
        if: steps.version.outputs.version != ''
        run: make -j2 VERSION=${{ steps.version.outputs.version }} BRANCH_NAME=main build.all
        env:
          # docker buildx doesn't load the images it builds unless asked to.
          BUILD_ARGS: "--load"

      - name: Find the image
        id: image
        if: steps.version.outputs.version != ''
        run: |
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -m1 "/$PACKAGE-amd64:")
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Before anything is pushed: no release with a critical vulnerability
      # that has a fix.
      - name: Scan the image
        if: steps.version.outputs.version != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.image }}
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Log in to the registries
        if: steps.version.outputs.version != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_MIRROR_ACCESS_ID }}
          XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_MIRROR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$XPKG_MIRROR_TOKEN" | docker login xpkg.upbound.io -u "$XPKG_MIRROR_ACCESS_ID" --password-stdin

      - name: Publish to GHCR
        if: steps.version.outputs.version != ''
        run: make -j2 VERSION=${{ steps.version.outputs.version }} BRANCH_NAME=main XPKG_REG_ORGS=$GHCR_ORG XPKG_REG_ORGS_NO_PROMOTE=$GHCR_ORG publish

      # Adds extensions/ (icon, readme, release notes; shown by the Upbound
      # Marketplace) to the package index. That changes the package digest, so
      # it runs before the digest is taken for the mirror, signatures and
      # attestations. Upbound publishes no checksums for up; the one below was
      # recorded when the version was pinned.
      - name: Attach the extensions
        id: ghcr
        if: steps.version.outputs.version != ''
        run: |
          curl -fsSLo up "https://cli.upbound.io/stable/$UP_VERSION/bin/linux_amd64/up"
          echo "$UP_SHA256  up" | sha256sum -c -
          chmod +x up
          ./up alpha xpkg append --extensions-root=./extensions "$GHCR_ORG/$PACKAGE:${{ steps.version.outputs.version }}"
          echo "digest=$(crane digest "$GHCR_ORG/$PACKAGE:${{ steps.version.outputs.version }}")" >> "$GITHUB_OUTPUT"

      - name: Mirror to Upbound
        if: steps.version.outputs.version != ''
        run: |
          # Through a local copy: a direct copy asks Upbound for a token that
          # also covers the GHCR repository (to mount layers), which it refuses.
          crane pull --format oci "$GHCR_ORG/$PACKAGE@${{ steps.ghcr.outputs.digest }}" pkg
          crane push pkg "$UPBOUND_ORG/$PACKAGE:${{ steps.version.outputs.version }}"
          digest=$(crane digest "$UPBOUND_ORG/$PACKAGE:${{ steps.version.outputs.version }}")
          if [[ $digest != "${{ steps.ghcr.outputs.digest }}" ]]; then
            echo "::error::Upbound digest $digest differs from GHCR ${{ steps.ghcr.outputs.digest }}"
            exit 1
          fi

      - name: Sign
        if: steps.version.outputs.version != ''
        run: |
          cosign sign --yes "$GHCR_ORG/$PACKAGE@${{ steps.ghcr.outputs.digest }}"
          cosign sign --yes "$UPBOUND_ORG/$PACKAGE@${{ steps.ghcr.outputs.digest }}"

      - name: SBOM
        if: steps.version.outputs.version != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        if: steps.version.outputs.version != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.GHCR_ORG }}/${{ env.PACKAGE }}
          subject-digest: ${{ steps.ghcr.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: steps.version.outputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_ORG }}/${{ env.PACKAGE }}
          subject-digest: ${{ steps.ghcr.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.ghcr.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Package: \`$GHCR_ORG/$PACKAGE:$VERSION\` and \`$UPBOUND_ORG/$PACKAGE:$VERSION\` (\`$DIGEST\`)

          Verify the signature and provenance:

          \`\`\`sh
          cosign verify $GHCR_ORG/$PACKAGE@$DIGEST \\
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://$GHCR_ORG/$PACKAGE@$DIGEST --repo ${{ github.repository }}
          \`\`\`
          EOF
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --notes-file notes.md --generate-notes sbom.spdx.json
