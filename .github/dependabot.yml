version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
    # The Terraform plugin libraries must match the versions Upjet is built
    # with (see its go.mod); newer ones don't compile with it. They move when
    # Upjet does.
    ignore:
      - dependency-name: github.com/hashicorp/terraform-plugin-sdk/v2
      - dependency-name: github.com/hashicorp/terraform-plugin-go
      - dependency-name: github.com/hashicorp/terraform-plugin-framework
    groups:
      # Bumped together with TERRAFORM_PROVIDER_VERSION and `make generate`.
      terraform-provider:
        patterns: [github.com/hostinger/terraform-provider-hostinger]
      go:
        patterns: ['*']
        exclude-patterns: [github.com/hostinger/terraform-provider-hostinger]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
