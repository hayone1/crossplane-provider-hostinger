# The zone must already exist in your Hostinger account. The external name is
# "<name>|<type>|<value>"; set it with the crossplane.io/external-name
# annotation (and spec.forProvider.zone) to import an existing record.
apiVersion: dns.hostinger.crossplane.io/v1alpha1
kind: Record
metadata:
  name: www
spec:
  forProvider:
    zone: example.com
    name: www
    type: A
    value: 203.0.113.10
    ttl: 3600
  providerConfigRef:
    name: default
