apiVersion: vps.hostinger.m.crossplane.io/v1alpha1
kind: PostInstallScript
metadata:
  name: nginx
  namespace: default
spec:
  forProvider:
    name: install-nginx
    content: |
      #!/bin/bash
      apt-get update
      apt-get install -y nginx
      systemctl enable --now nginx
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
