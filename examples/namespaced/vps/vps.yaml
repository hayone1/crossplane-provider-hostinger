# Creating a VPS purchases a subscription with the default payment method,
# and deleting it turns off its auto-renewal (the VPS runs until the end
# of the paid period). Consider
# managementPolicies or deletionPolicy: Orphan for production servers.
apiVersion: vps.hostinger.m.crossplane.io/v1alpha1
kind: VPS
metadata:
  name: web-01
  namespace: default
spec:
  forProvider:
    plan: hostingercom-vps-kvm1-usd-1m
    dataCenterId: 24
    templateId: 1077
    hostname: web-01.example.com
    passwordSecretRef:
      name: web-01-root
      key: password
    postInstallScriptIdRef:
      name: nginx
    sshKeyIdsSelector:
      matchLabels:
        owner: platform-team
  writeConnectionSecretToRef:
    name: web-01-vps
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: v1
kind: Secret
metadata:
  name: web-01-root
  namespace: default
type: Opaque
stringData:
  password: change-me-to-a-long-random-password
